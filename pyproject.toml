[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-response-quality-evaluator"
version = "1.0.0"
description = "A production-grade, reusable evaluation framework for scoring LLM responses across multiple quality dimensions."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "AI Evaluation Specialist", email = "evaluator@example.com" }
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
evaluator = "evaluator.cli:main"

[tool.setuptools.packages.find]
include = ["evaluator*"]
